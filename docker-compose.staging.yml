services:
  api:
    build: .
    expose:
      - "8080"
    environment: &app_environment
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN}
      META_TEST_PAGE_ACCESS_TOKEN: ${META_TEST_PAGE_ACCESS_TOKEN:-}
      META_PAGE_ID: ${META_PAGE_ID}
      META_TEST_PAGE_ID: ${META_TEST_PAGE_ID:-}
      META_ACTIVE_PAGE: ${META_ACTIVE_PAGE:-primary}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v25.0}
      META_LIVE_SEND_ENABLED: ${META_LIVE_SEND_ENABLED:-false}
      MULTI_ACTION_ROLLOUT_MODE: ${MULTI_ACTION_ROLLOUT_MODE:-shadow}
      MULTI_ACTION_CANARY_PERCENT: ${MULTI_ACTION_CANARY_PERCENT:-0}
      MULTI_ACTION_PRIMARY_APPROVED: ${MULTI_ACTION_PRIMARY_APPROVED:-false}
      FOLLOWUP_MODE: ${FOLLOWUP_MODE:-shadow}
      FOLLOWUP_PRIMARY_APPROVED: ${FOLLOWUP_PRIMARY_APPROVED:-false}
      META_STAFF_NAME: ${META_STAFF_NAME:-Mai Lan}
      META_OPENING_VARIANT: ${META_OPENING_VARIANT:-AUTO.dynamic}
      META_WORKER_CONSUMER: ${META_WORKER_CONSUMER:-worker-1}
      META_DEBOUNCE_MS: ${META_DEBOUNCE_MS:-4000}
      META_GATEWAY_PORT: ${META_GATEWAY_PORT:-8081}
      META_GATEWAY_ENABLED: ${META_GATEWAY_ENABLED:-false}
      META_PUBLIC_WEBHOOK_URL: ${META_PUBLIC_WEBHOOK_URL:-}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
      OUTBOUND_WINDOW_HOURS: ${OUTBOUND_WINDOW_HOURS:-24}
      LLM_PROVIDER: ${LLM_PROVIDER:-hybrid}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
      LLM_PROMPT_PROFILE: ${LLM_PROMPT_PROFILE:-legacy}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-30000}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-1200}
      LLM_USD_TO_VND_RATE: ${LLM_USD_TO_VND_RATE:-26000}
      LLM_HYBRID_PROVIDER_TIMEOUT_MS: ${LLM_HYBRID_PROVIDER_TIMEOUT_MS:-15000}
      LLM_HYBRID_FALLBACK_TIMEOUT_MS: ${LLM_HYBRID_FALLBACK_TIMEOUT_MS:-30000}
      LLM_HYBRID_HEDGE_DELAY_MS: ${LLM_HYBRID_HEDGE_DELAY_MS:-2500}
      LLM_HYBRID_COOLDOWN_MS: ${LLM_HYBRID_COOLDOWN_MS:-300000}
      CODEX_LLM_ENABLED: ${CODEX_LLM_ENABLED:-false}
      CODEX_CLI_PATH: ${CODEX_CLI_PATH:-}
      CODEX_LLM_MODEL: ${CODEX_LLM_MODEL:-gpt-5.4-mini}
      CODEX_LLM_TIMEOUT_MS: ${CODEX_LLM_TIMEOUT_MS:-30000}
      CODEX_LLM_REASONING_EFFORT: ${CODEX_LLM_REASONING_EFFORT:-low}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "dist/src/worker.js"]
    environment: *app_environment
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  followup-worker:
    build: .
    command: ["node", "dist/src/followupWorker.js"]
    environment: *app_environment
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stopirex}
      POSTGRES_USER: ${POSTGRES_USER:-stopirex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stopirex}
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - stopirex_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  stopirex_pg:
