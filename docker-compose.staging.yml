services:
  api:
    build: .
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "dist/src/worker.js"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  followup-worker:
    build: .
    command: ["node", "dist/src/followupWorker.js"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  postgres:
    extends: { file: docker-compose.yml, service: postgres }
  redis:
    extends: { file: docker-compose.yml, service: redis }
