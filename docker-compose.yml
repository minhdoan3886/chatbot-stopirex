services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stopirex
      POSTGRES_USER: stopirex
      POSTGRES_PASSWORD: stopirex
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stopirex -d stopirex"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - stopirex_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stopirex_pg:
